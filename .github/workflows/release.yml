name: Release

# Trigger either by pushing a matching tag (`git tag v1.0.0 && git push origin v1.0.0`)
# or via workflow_dispatch (which tags HEAD at `v<version>` from gradle.properties).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Resolve and validate release version
        id: version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "Could not read version from Gradle"
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
              exit 1
            fi
          else
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: ./gradlew check build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          JAR: build/libs/minelink-${{ steps.version.outputs.version }}.jar
        run: |
          sha256sum "$JAR" | sed 's#build/libs/##' > "$JAR.sha256"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" "$JAR" "$JAR.sha256" \
              --verify-tag --generate-notes --title "MineLink $TAG"
          else
            gh release create "$TAG" "$JAR" "$JAR.sha256" \
              --target "$GITHUB_SHA" --generate-notes --title "MineLink $TAG"
          fi
