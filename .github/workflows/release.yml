name: Release

# Trigger either by pushing a matching tag (`git tag v1.0.0 && git push origin v1.0.0`)
# or via workflow_dispatch from `main` (which tags HEAD at `v<version>` from gradle.properties).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve and validate release version
        id: version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$version" ]; then
            echo "Could not read version from Gradle"
            exit 1
          fi
          tag="v$version"
          tag_exists=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
              exit 1
            fi
            tag_exists=true
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists on $existing_sha (expected $GITHUB_SHA)"
              exit 1
            fi
            tag_exists=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
      - run: ./gradlew build
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
          JAR: build/libs/minelink-${{ steps.version.outputs.version }}.jar
        run: |
          sha256sum "$JAR" | sed 's#build/libs/##' > "$JAR.sha256"
          cp "$JAR" build/libs/minelink.jar
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$TAG_EXISTS" != "true" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" "$JAR" "$JAR.sha256" build/libs/minelink.jar \
            --verify-tag --generate-notes --title "MineLink $TAG"
      - name: Collect release changelog and supported platform versions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "RELEASE_CHANGELOG<<EOF_MINELINK_CHANGELOG"
            gh release view "$TAG" --json body --jq .body
            echo "EOF_MINELINK_CHANGELOG"
          } >> "$GITHUB_ENV"

          modrinth_versions=$(curl -fsSL -A "minelink-release" \
            "https://api.modrinth.com/v2/tag/game_version" \
            | jq -r '[.[] | select(.version_type == "release") | .version] | (index("1.7.2") // error("1.7.2 not found")) as $idx | .[:$idx + 1] | join(",")')
          if [ -z "$modrinth_versions" ]; then
            echo "Resolved empty Modrinth game version list"
            exit 1
          fi
          echo "MODRINTH_GAME_VERSIONS=$modrinth_versions" >> "$GITHUB_ENV"

          hangar_versions=$(curl -fsSL -A "minelink-release" \
            "https://hangar.papermc.io/api/v1/platforms/VELOCITY/versions" \
            | jq -r '((map(.version) | index("3.4")) // error("3.4 not found")) as $idx | .[:$idx + 1] | map(if (.subVersions | length) > 0 then .subVersions else [.version] end) | flatten | join(",")')
          if [ -z "$hangar_versions" ]; then
            echo "Resolved empty Hangar Velocity version list"
            exit 1
          fi
          echo "HANGAR_VELOCITY_VERSIONS=$hangar_versions" >> "$GITHUB_ENV"
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::notice::Skipping Modrinth publish because MODRINTH_TOKEN is not set"
            exit 0
          fi
          ./gradlew modrinth
      - name: Publish to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then
            echo "::notice::Skipping Hangar publish because HANGAR_API_TOKEN is not set"
            exit 0
          fi
          ./gradlew publishPluginPublicationToHangar
